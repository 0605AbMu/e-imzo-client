name: .NET CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restore dependencies
      run: dotnet restore dotnet/EImzo.sln

    - name: Build Solution
      run: dotnet build dotnet/EImzo.sln -c Release --no-restore

    - name: Run Tests
      run: dotnet test dotnet/EImzo.sln -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Pack NuGet package
      run: dotnet pack dotnet/src/EImzo.Client/EImzo.Client.csproj -c Release --no-build -o ./artifacts
